      question_register:
      - id: society-q01
        question: How many people normally live here, including those temporarily away during the fire?
        source_ids:
        - CENSUS3
        prior_semantic_status: blocked
        current_coverage: Composable
        assessment: Count distinct society:HumanIndividual sources of society:UsualResidenceIn to the area
          at the reference date, including qualifying absentees. Geographical inclusion, deduplication and
          coverage require a model.
      - id: society-q02
        question: Do two families sharing one building form one household?
        source_ids:
        - CENSUS3
        prior_semantic_status: blocked
        current_coverage: Convention gap
        assessment: Shared occupancy and shared provisioning can partition the same building differently. Ask
          which convention this survey uses and identify the housing units or provisioning arrangements.
      - id: society-q03
        question: Who lives alone and might need help leaving a threatened area?
        source_ids:
        - CENSUS3
        prior_semantic_status: blocked
        current_coverage: Partial
        assessment: A one-person arrangement requires a household boundary. Identify assistance need separately.
          A resident with mobility assistance can live alone; living alone cannot establish need.
      - id: society-q04
        question: Which children and adults are members of the same household?
        source_ids:
        - CENSUS3
        prior_semantic_status: blocked
        current_coverage: Gap
        assessment: Age is available through society:PersonAge. Membership in a household needs a convention,
          an identified arrangement and a reference time. OrganizationMembership has the wrong target.
      - id: society-q05
        question: How many residents moved away rather than merely evacuated overnight?
        source_ids:
        - EVAC
        prior_semantic_status: blocked
        current_coverage: Composable
        assessment: society:ResidentialMigration and UsualResidenceIn distinguish a changed usual home. Count
          distinct movers over an interval, comparing origin and destination. Overnight evacuation alone fails
          the change criterion.
      - id: society-q06
        question: Which households changed membership after a birth?
        source_ids:
        - VITAL
        prior_semantic_status: blocked
        current_coverage: Gap
        assessment: Compare household membership before and after a dated live birth. life:Reproduction is
          a process. Registration time can differ from occurrence; household identity and the bounded live-birth
          reading need review.
      - id: society-q07
        question: How many people died during the disaster, without assuming that every death was caused by
          it?
        source_ids:
        - VITAL
        prior_semantic_status: blocked
        current_coverage: Composable
        assessment: life:OrganismDeath supplies a bounded occurrence. Select identified human decedents and
          the disaster interval, then deduplicate. Temporal overlap supplies no causal attribution.
      - id: society-q08
        question: Who is related by parenthood even though they live apart?
        source_ids:
        - CENSUS3
        prior_semantic_status: blocked
        current_coverage: Represented for recognized parenthood
        assessment: society:RecognizedParentOf records identified endpoints under a regime independently of
          UsualResidenceIn. Biological descent needs its own evidence.
      - id: society-q09
        question: Which organizations remain identifiable when their staff change?
        source_ids:
        - OSTROM
        prior_semantic_status: blocked
        current_coverage: Partial
        assessment: society:Organization and OrganizationMembership allow roster turnover; FormallyConstituted
          qualifies the organization where evidenced. A continuity or succession rule decides the difficult
          merger case.
      - id: society-q10
        question: Did marriage or divorce change a legally recognized partnership?
        source_ids:
        - VITAL
        prior_semantic_status: blocked
        current_coverage: Gap
        assessment: RecognizedParentOf has different endpoints in practice and a different meaning. A recognition
          regime, partnership tie, effective formation or termination, and registration evidence are needed.
      - id: society-q11
        question: Which people share essential living arrangements without being relatives?
        source_ids:
        - CENSUS3
        prior_semantic_status: blocked
        current_coverage: Gap
        assessment: Shared essentials require a housekeeping criterion. Parenthood covers only one kin tie.
          Lack of a recorded parent relationship cannot establish unrelatedness.
      - id: society-q12
        question: How many evacuees are still away from their usual homes?
        source_ids:
        - DISPLACE
        prior_semantic_status: blocked
        current_coverage: Partial
        assessment: Join UsualResidenceIn with actual location and a dated evacuation cohort. Resolve current
          absence with follow-up observations. An unobserved return leaves status unknown.
      - id: society-q13
        question: When did an organization begin or cease to exist?
        source_ids:
        - OSTROM
        prior_semantic_status: blocked
        current_coverage: Partial
