  evidence:
  - evidence_id: E-org
    source_id: OWL
    locator: OBI:0000245, asserted parent BFO:0000040 and editor note
    source_term: organization
    paraphrase: Membership and decision rules help identify the organization. Material-entity placement carries
      an explicit editorial reservation.
    evidence_kind: distinction
    interpretation: Test rule-based continuity locally. Importing the material parent would reopen an approved
      agency decision.
  - evidence_id: E-member
    source_id: OWL
    locator: OBI:0000846 and inverse OBI:0001688
    source_term: is member of organization
    paraphrase: The object property has organization range. The definition invokes a member role and discusses
      persons and organizations.
    evidence_kind: distinction
    interpretation: IMOD observes a directed structural relationship. Preserve the broader Agent source and
      test local recognition criteria.
  - evidence_id: E-aggregate
    source_id: OWL
    locator: OMRSE:00000023, 00000267, 00000033
    source_term: collection of humans; social category; aggregate of organizations
    paraphrase: The human collection restricts components to humans. A scheme demarcates a social category.
      The organization aggregate definition explicitly excludes an organization acting in its own right.
    evidence_kind: distinction
    interpretation: Ask separately whether the analyst selected records, a collective persists, or a federation
      can act.
  - evidence_id: E-house
    source_id: HOUS
    locator: Use Cases; Background Information; Definitions; OWL OMRSE:00000076
    source_term: household
    paraphrase: ACS and synthetic population applications motivate an occupancy-based household, allowing a
      single human.
    evidence_kind: distinction
    interpretation: The housekeeping convention in society-q02 and q15 uses shared provision and can cross
      housing-unit boundaries. Keep convention explicit.
  - evidence_id: E-holder
    source_id: HOLDER
    locator: US Census Householder; US Census Reference Person; OWL OMRSE:00000081
    source_term: householder
    paraphrase: The reference person anchors reporting relationships. The page discusses tenure and designation,
      including a fallback in its quoted source.
    evidence_kind: distinction
    interpretation: Designated reporter does not establish authority over other members. Verify survey edition
      before mapping fallback cases.
  - evidence_id: E-role
    source_id: CONFER
    locator: 'Option #1; Option #2; compare OMRSE:00000086, 00000001, 00000025'
    source_term: role bearer, conferrer and realization
    paraphrase: A hiring process can link bestower and bearer. The page also considers a declaration with a
      dependent output and acknowledges roles without explicit bestowal.
    evidence_kind: distinction
    interpretation: Keep the role bearer, counterparty, recognizing authority and occasion independently identifiable.
      An acting organization may itself bear a role.
  - evidence_id: E-act
    source_id: OWL
    locator: IAO:0021003, IAO:0021009, IAO:0021001
    source_term: social act and deontic declaration
    paraphrase: A directed, perception-dependent planned act is broader than a declaration that changes a deontic
      role. A document act is a further specialization.
    evidence_kind: distinction
    interpretation: Membership can accrue automatically. Restrict the candidate below to rule-effective admissions
      and leave physical paperwork optional.
  - evidence_id: E-local
    source_id: IM
    locator: src/society.kwv:13-133; src/imod.kwv:405-420; src/life.kwv:162-185
    source_term: person, collective, organization and recognition
    paraphrase: The root supplies two collective readings. Society declares OrganizationMembership from Agent
      to Organization and keeps constitution as an applicable attribute.
    evidence_kind: distinction
    interpretation: Recognition can survive a role change or turnover. Nothing in the edge supplies an admission
      date.
  - evidence_id: E-neighbor
    source_id: IM
    locator: src/sociology.kwv; src/economics.kwv; src/agency.kwv; strategies/observations.obs
    source_term: work, employment, coordination, adoption and consent
    paraphrase: Worker and EmployedPerson classify people in context. EmployeeOf identifies a counterparty.
      RuleAdoption, ConsentGrant and ChoiceCommitment identify bounded occurrences.
    evidence_kind: distinction
    interpretation: Hire, joining, appointment and rule adoption may occur on different dates. Reuse the existing
      names for their own questions.
  - evidence_id: E-ledger
    source_id: HIST
    locator: QUESTION_ORIGIN.json q01-q15; organization and collective-lineage decisions
    source_term: historical probes
    paraphrase: The former dossier tested living arrangements, usual residence, organizational persistence
      and demographic events. Later decisions retired Institution and SocialAgent.
    evidence_kind: distinction
    interpretation: Retain historical prompts with an updated answerability assessment. Do not revive retired
      identifiers.
