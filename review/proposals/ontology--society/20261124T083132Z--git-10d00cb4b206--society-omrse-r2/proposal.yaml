proposal:
  id: society-omrse
  revision_id: society-omrse-r2
  title: Which social unit persists, who belongs, and when does recognition take effect?
  iteration: 2
  supersedes_revision: society-omrse-r1
  status: revised
  generated_at: '2026-11-22'
  scope:
    domain: imod:Society
    purpose: Review existing Tier 1 social participants and the effective onset of recognized organizational
      membership.
    requested_tier: 1
    target_community: IMOD Society maintainers, organization researchers, census methodologists and OMRSE reviewers
    tier_1_context_required: false
    tier_1_context_status: not_required
    included:
    - Participants, collectives, roles, ties and institutional occurrences
    excluded:
    - Jurisdiction-specific legal classifications and survey code lists
    spatial_context: Residence geography and organizational jurisdiction may differ.
    temporal_context: Compare effective time, observation interval and record time.
    intended_scales:
    - individual
    - living arrangement
    - organization
    - federation
    - statistical area
  source_policy:
    authority_criteria:
    - Use matched Resources source and Reasoner projection for existing declarations.
    - Use released OWL for assertions and linked design notes for motivations and alternatives.
    inference_policy: Directional analogies require matching bearer, endpoints, recognition and time. No crosswalk
      asserts OWL equivalence.
